<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eB Lists</title>
    <link rel="icon" type="image/png" sizes="48x48" href="./img/favicon48.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./vendor/cytoscape.min.js"></script>
    <link rel="stylesheet" href="./vendor/vanillagrid.css">
    <link rel="stylesheet" href="./vendor/hcg-autocomplete.css">
    <link rel="stylesheet" href="./app.css">
    <link rel="stylesheet" href="./holonInspector.css">
    <style>
        .workspace-primary { grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); align-items: stretch; }
        .workspace-primary .panel-graph { grid-column: auto; }
        .holon-inspector { min-height: 460px; padding: 0 0 12px; overflow: hidden; }
        .holon-inspector > .panel-heading { padding: 14px 14px 8px; margin: 0; border-bottom: 1px solid var(--eb-border); }
        #holonInspectorContent { padding: 12px 14px; overflow: auto; max-height: 410px; }
        .holon-inspector-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; overflow-wrap: anywhere; }
        .holon-inspector-actions { display: flex; gap: 8px; margin-bottom: 12px; }
        .holon-inspector-actions button { padding: 7px 10px; border: 1px solid var(--eb-border-strong); border-radius: 5px; background: var(--eb-input-bg); color: var(--eb-text); }
        .holon-property-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .holon-property-table th, .holon-property-table td { padding: 7px 6px; border-bottom: 1px solid var(--eb-border); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
        .holon-property-table th { width: 38%; font-size: 12px; opacity: .7; font-weight: 600; }
        .holon-property-table td { white-space: pre-wrap; font-size: 13px; }
        .holarchy-heading { align-items: flex-start; justify-content: flex-start !important; flex-wrap: wrap; }
        .holarchy-heading h3 { flex: 0 0 auto; }
        .holarchy-filter { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-left: 2px; min-width: 0; }
        .holarchy-filter-field { display: flex; align-items: center; gap: 5px; }
        .holarchy-filter-field > span { font-size: 12px; font-weight: 600; opacity: .72; }
        .holarchy-filter #graphRoot { width: 220px; }
        .holarchy-filter #graphDepth { display: inline-block !important; width: 68px; min-width: 68px; height: 32px; padding: 4px 7px; border: 1px solid var(--eb-border-strong); border-radius: 5px; background: var(--eb-input-bg); color: var(--eb-text); }
        .holarchy-filter-field:has(#graphDepth) { flex: 0 0 auto; white-space: nowrap; }
        .holarchy-filter-prov { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
        .holarchy-filter-prov label { font-size: 12px; font-weight: 600; opacity: .72; cursor: pointer; }
        .holarchy-filter-prov input { margin: 0; accent-color: var(--eb-accent, #5b8def); }
        @media (max-width: 760px) {
            .workspace-primary { grid-template-columns: 1fr; }
            .holarchy-heading { align-items: stretch; }
            .holarchy-filter { margin-left: 0; width: 100%; }
            .holarchy-filter #graphRoot { width: 100%; min-width: 180px; }
        }
    </style>
</head>
<body>
    <div id="shell" class="eb-shell">
        <div id="header"></div>
        <div id="status"></div>
        <main class="eb-main">
            <section id="app" class="card" hidden>
                <div class="workspace-grid workspace-primary">
                    <section class="panel panel-graph">
                        <div class="panel-heading holarchy-heading">
                            <h3>Holarchy</h3>
                            <div class="holarchy-filter" role="group" aria-label="Holarchy filters">
                                <div class="holarchy-filter-field">
                                    <span>Root</span>
                                    <input id="graphRoot" type="text" autocomplete="off" aria-label="Holarchy graph root" placeholder="Choose a root Holon…">
                                </div>
                                <div class="holarchy-filter-field">
                                    <span>Depth</span>
                                    <select id="graphDepth" aria-label="Holarchy graph depth">
                                        <option value="1">1</option>
                                        <option value="2" selected>2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="all">∞</option>
                                    </select>
                                </div>
                                <div class="holarchy-filter-prov">
                                    <input id="graphProvenance" type="checkbox" aria-label="Show provenance">
                                    <label for="graphProvenance">Prov</label>
                                </div>
                            </div>
                        </div>
                        <div id="holonGraph" aria-label="Holon relationship graph"></div>
                    </section>
                    <aside id="holonInspector" class="panel holon-inspector" aria-label="Holon properties">
                        <div class="panel-heading"><h3>Holon Properties</h3></div>
                        <div id="holonInspectorContent" class="muted">Select a Holon to inspect its properties.</div>
                    </aside>
                </div>
                <div class="workspace-grid workspace-grids">
                    <section class="panel"><div class="panel-heading"><h3>Holons</h3><div class="panel-actions"><button id="newHolon" type="button">+ Holon</button><button id="newHolonType" type="button">+ Type</button></div></div><div id="grid" aria-label="Holons"></div></section>
                    <section class="panel"><h3 id="activeList">Relationships</h3><div class="muted" id="listMode"></div><div id="detailGrid" aria-label="Relationships"></div></section>
                </div>
            </section>
        </main>
    </div>
    <script src="./vendor/vanillagrid.js"></script>
    <script src="./vendor/hcg-autocomplete.js"></script>
    <script type="module">
        const header = document.getElementById('header');
        const response = await fetch(`./header.html?v=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Unable to load header: ${response.status}`);
        header.outerHTML = await response.text();
        const logoMenu = document.querySelector('.eb-logo-menu');
        document.addEventListener('click', event => { if (!logoMenu?.open) return; if (logoMenu.contains(event.target)) return; logoMenu.removeAttribute('open'); });
        await import('./eBStatus.js').then(({ eBStatus }) => { eBStatus.init(); window.ebStatus = eBStatus; });
        await import('./CFstatus.js').then(({ CFstatus }) => { window.ebCFStatus = CFstatus.init(); });
        await import(`./app.js?v=${Date.now()}`);
    </script>
</body>
</html>
