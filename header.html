<header id="header" class="eb-header">
    <div class="eb-header-inner">
        <details class="eb-logo-menu">
            <summary aria-label="eBliss tools">
                <img
                    class="eb-logo"
                    src="./img/favicon48.png"
                    alt="eBliss"
                    width="40"
                    height="40"
                >
            </summary>
            <div class="eb-logo-menu-panel">
                <button id="refreshApp" type="button">Refresh app</button>
                <button id="debugApp" type="button">Debug</button>
                <div class="eb-menu-separator"></div>
                <strong class="eb-menu-label">Test status</strong>
                <button id="testStatusSuccess" type="button">Success</button>
                <button id="testStatusWarn" type="button">Warning</button>
                <button id="testStatusError" type="button">Error</button>
                <div class="eb-menu-separator"></div>
                <strong class="eb-menu-label">Test components</strong>
                <button id="testComboBox" type="button">Combo box</button>
            </div>
        </details>
        <div class="eb-brand">eB Lists</div>
        <div class="eb-app-name">Holon Workspace</div>
        <div class="eb-row">
            <div id="cf-status" aria-label="Cloudflare deployment status"></div>
            <button id="refresh" type="button">Refresh</button>
            <div id="auth"></div>
        </div>
    </div>
</header>
